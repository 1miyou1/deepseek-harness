# Private module scheduler host layer applied after dsh-base.

- insert:
    - id: module-scheduler
      name: '@deepseek-ai/dsh-experimental-module-scheduler'
      config:
        maxConcurrent: 4
        queueLimit: 32
        timeoutMs: 30000
        maxRecentRuns: 50
        agentStepModelRoutes:
          luna: { provider: niko-gemini, model: gemini-3.8-flash }
          terra: { provider: niko-gemini, model: gemini-3.8-flash }
          sol: { provider: openai-codex, model: gpt-5.6-sol }
        freeformAgentRoute: { provider: xindu, model: deepseek-v4.1-flash }
    - id: module-network-research
      name: '@deepseek-ai/dsh-experimental-module-scheduler-profile/network-research'
